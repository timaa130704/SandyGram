# Релиз по тегу: git tag v2.5.0 && git push origin v2.5.0
# Собирает APK (ubuntu) + Windows-zip (windows) и публикует GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install deps
        working-directory: app
        run: npm ci

      # android/ не в репозитории — генерируем нативный проект.
      # Подпись: стандартный debug.keystore из шаблона RN, совпадает с прошлыми релизами.
      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk SandyGram-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: SandyGram-${{ github.ref_name }}.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish WPF app
        run: dotnet publish desktop/SandyGram.csproj -c Release -r win-x64 --self-contained true -o publish-out

      - name: Zip
        run: Compress-Archive -Path publish-out\* -DestinationPath SandyGram-${{ github.ref_name }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: SandyGram-${{ github.ref_name }}-win-x64.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SandyGram-*.apk
            SandyGram-*-win-x64.zip
          generate_release_notes: true
