<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>SandyGram</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- ===== Auth ===== -->
    <main class="auth-shell" id="authShell">
      <section class="auth-card">
        <div class="brand-mark">S</div>
        <h1>SandyGram</h1>
        <p class="muted">Быстрый монохромный мессенджер</p>
        <div class="segment-control">
          <button class="segment active" data-mode="register" type="button">Регистрация</button>
          <button class="segment" data-mode="login" type="button">Вход</button>
        </div>
        <form id="authForm">
          <label class="field"><span>Имя пользователя</span><input id="username" autocomplete="username" placeholder="например, driga" required /></label>
          <label class="field"><span>Пароль</span><input id="password" type="password" autocomplete="current-password" placeholder="Минимум 6 символов" required /></label>
          <p class="error" id="authError"></p>
          <button class="primary-button" type="submit" id="submitButton">Создать аккаунт</button>
        </form>
        <div class="auth-divider"><span>или</span></div>
        <button class="google-button" id="googleButton" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Войти через Google
        </button>
      </section>
    </main>

    <!-- ===== Messenger ===== -->
    <main class="messenger-shell hidden" id="messengerShell">
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-top">
          <button class="icon-button" id="menuButton" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
          <div class="search-box"><span class="search-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span><input id="chatSearch" placeholder="Поиск" autocomplete="off" /></div>
        </header>
        <div class="chat-list" id="chatList"></div>
        <div class="search-results hidden" id="searchResults"></div>
        <button class="fab" id="newChatFab" aria-label="Новое сообщение"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
      </aside>

      <section class="conversation" id="conversation">
        <div class="conversation-placeholder" id="conversationPlaceholder"><span>Выберите чат, чтобы начать общение</span></div>
        <div class="conversation-inner hidden" id="conversationInner">
          <header class="conversation-header" id="conversationHeader">
            <button class="icon-button back-button" id="backButton" aria-label="Назад"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <div class="avatar" id="chatAvatar">S</div>
            <div class="chat-title-block" id="chatTitleBlock">
              <strong id="chatTitle">Чат</strong>
              <small id="chatSubtitle"></small>
            </div>
            <button class="icon-button" id="chatMenuButton" aria-label="Меню чата"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
          </header>
          <div class="pinned-bar hidden" id="pinnedBar">
            <span class="pin-mark">📌</span>
            <span class="pinned-bar-text" id="pinnedBarText"></span>
            <button class="icon-button small" id="unpinButton" aria-label="Открепить">✕</button>
          </div>
          <div class="messages" id="messages"></div>
          <div class="reply-bar hidden" id="replyBar">
            <div class="reply-bar-text"><b id="replyBarTitle"></b><span id="replyBarText"></span></div>
            <button class="icon-button" id="cancelReply" aria-label="Отменить">✕</button>
          </div>
          <div class="closed-bar hidden" id="closedBar">🔒 Топик закрыт — писать могут только админы</div>
          <form class="composer" id="messageForm">
            <button type="button" class="icon-button" id="emojiButton" aria-label="Эмодзи"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
            <button type="button" class="icon-button" id="attachButton" aria-label="Фото"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
            <input type="file" id="fileInput" accept="image/*" hidden />
            <textarea id="messageInput" rows="1" autocomplete="off" placeholder="Сообщение"></textarea>
            <button type="button" class="icon-button" id="voiceButton" aria-label="Голосовое"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg></button>
            <button type="submit" class="send-button" id="sendButton" aria-label="Отправить"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
          </form>
          <div class="emoji-panel hidden" id="emojiPanel">
            <div class="emoji-tabs">
              <button type="button" id="tabEmoji" class="active">Эмодзи</button>
              <button type="button" id="tabStickers">Стикеры</button>
            </div>
            <div class="emoji-grid" id="emojiGrid"></div>
            <div class="sticker-grid hidden" id="stickerGrid"></div>
          </div>
        </div>
      </section>

      <!-- Settings -->
      <aside class="side-panel hidden" id="settingsPanel">
        <header class="panel-header"><button class="icon-button" id="closeSettings" aria-label="Закрыть">‹</button><h2>Настройки</h2></header>
        <div class="settings-profile">
          <div class="avatar large" id="settingsAvatar">S</div>
          <h3 id="settingsName">SandyGram</h3>
          <p class="muted" id="settingsHandle">@user</p>
          <p id="settingsBio"></p>
        </div>
        <div class="settings-group">
          <button class="settings-row" data-action="profile"><span class="row-icon">👤</span><span>Изменить профиль</span></button>
          <button class="settings-row" data-action="photo"><span class="row-icon">🖼</span><span>Фото профиля</span></button>
          <input type="file" id="avatarInput" accept="image/*" hidden />
          <button class="settings-row" data-action="appearance"><span class="row-icon">◐</span><span>Тема: <b id="themeLabel">тёмная</b></span></button>
          <button class="settings-row" data-action="color"><span class="row-icon">🎨</span><span>Цвет аватара</span></button>
          <button class="settings-row" data-action="privacy"><span class="row-icon">👁</span><span>Скрывать время захода: <b id="lastSeenLabel">выкл</b></span></button>
          <button class="settings-row" data-action="deleteAccount"><span class="row-icon">🗑</span><span>Удалить аккаунт</span></button>
        </div>
        <button class="logout-button" id="logoutButton">Выйти из аккаунта</button>
      </aside>

      <!-- New chat -->
      <aside class="side-panel hidden" id="newChatPanel">
        <header class="panel-header"><button class="icon-button" id="closeNewChat" aria-label="Закрыть">‹</button><h2>Новое сообщение</h2></header>
        <div class="panel-body">
          <div class="search-box"><span class="search-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span><input id="userSearch" placeholder="Найти пользователя" autocomplete="off" /></div>
          <button class="settings-row" id="createGroupButton"><span class="row-icon">👥</span><span>Создать группу</span></button>
          <button class="settings-row" id="createChannelButton"><span class="row-icon">📢</span><span>Создать канал</span></button>
          <div class="user-results" id="userResults"></div>
        </div>
      </aside>

      <!-- Chat info -->
      <aside class="side-panel hidden" id="chatInfoPanel">
        <header class="panel-header"><button class="icon-button" id="closeChatInfo" aria-label="Закрыть">‹</button><h2>Информация</h2></header>
        <div class="panel-body" id="chatInfoBody"></div>
      </aside>
    </main>

    <!-- Modal -->
    <div class="modal-backdrop hidden" id="modalBackdrop">
      <div class="modal" id="modal"></div>
    </div>

    <!-- Context menu -->
    <div class="context-menu hidden" id="contextMenu"></div>

    <div class="toast" id="toast"></div>
    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
